<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080d" />
    <title>Moved to ClearTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #07080d;
        --cream: #f4efe6;
        --mute: rgba(244, 239, 230, 0.62);
        --mint: #8ef5c8;
        --ice: #7cd4ff;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        min-height: 100%;
        background: var(--ink);
        color: var(--cream);
        font-family: "DM Sans", system-ui, sans-serif;
        overflow: hidden;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        isolation: isolate;
      }

      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
        z-index: 0;
        will-change: transform;
      }

      .orb-a {
        width: 42vw;
        height: 42vw;
        left: -8%;
        top: -12%;
        background: radial-gradient(circle, rgba(142, 245, 200, 0.28), transparent 68%);
        animation: drift-a 14s var(--ease) infinite alternate;
      }

      .orb-b {
        width: 38vw;
        height: 38vw;
        right: -10%;
        bottom: -16%;
        background: radial-gradient(circle, rgba(124, 212, 255, 0.24), transparent 68%);
        animation: drift-b 18s var(--ease) infinite alternate;
      }

      .orb-c {
        width: 22vw;
        height: 22vw;
        left: 42%;
        top: 28%;
        background: radial-gradient(circle, rgba(255, 232, 180, 0.12), transparent 70%);
        animation: pulse 7s ease-in-out infinite;
      }

      .grain {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.14;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      .glow {
        position: fixed;
        width: 28rem;
        height: 28rem;
        margin: -14rem 0 0 -14rem;
        border-radius: 50%;
        pointer-events: none;
        z-index: 1;
        background: radial-gradient(circle, rgba(142, 245, 200, 0.12), transparent 62%);
        transform: translate3d(-40vw, -40vh, 0);
        transition: transform 0.25s linear;
      }

      main {
        position: relative;
        z-index: 2;
        width: min(720px, calc(100vw - 40px));
        text-align: center;
        padding: 28px 12px 40px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
        color: var(--mute);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        opacity: 0;
        animation: rise 1s var(--ease) 0.1s forwards;
      }

      .eyebrow i {
        width: 28px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--mint));
        animation: draw 1.2s var(--ease) 0.3s both;
      }

      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(4.6rem, 16vw, 8.4rem);
        font-weight: 400;
        line-height: 0.88;
        letter-spacing: -0.04em;
      }

      h1 span {
        display: inline-block;
        opacity: 0;
        transform: translate3d(0, 48px, 0) rotate(6deg);
        animation: letter 1.05s var(--ease) forwards;
      }

      .lead, .moved {
        max-width: 22rem;
        margin: 0 auto;
        opacity: 0;
        transform: translateY(18px);
      }

      .lead {
        margin-top: 28px;
        color: var(--mute);
        font-size: clamp(1.05rem, 2.4vw, 1.25rem);
        font-weight: 500;
        line-height: 1.45;
        animation: rise 1s var(--ease) 0.85s forwards;
      }

      .moved {
        margin-top: 10px;
        font-size: clamp(1.05rem, 2.4vw, 1.25rem);
        font-weight: 500;
        animation: rise 1s var(--ease) 1.05s forwards;
      }

      .brand {
        display: inline-block;
        margin-left: 6px;
        font-family: "Syne", sans-serif;
        font-size: 1.15em;
        font-weight: 800;
        letter-spacing: -0.04em;
        background: linear-gradient(110deg, var(--mint), #fff 42%, var(--ice) 68%, var(--mint));
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 3.4s ease-in-out infinite;
      }

      .track {
        width: min(280px, 70vw);
        margin: 36px auto 0;
        overflow: visible;
        opacity: 0;
        animation: rise 1s var(--ease) 1.2s forwards;
      }

      .track path {
        fill: none;
        stroke: rgba(244, 239, 230, 0.16);
        stroke-width: 1.25;
      }

      .track .flow {
        stroke: url(#flow);
        stroke-dasharray: 36 220;
        stroke-linecap: round;
        animation: dash 2.8s linear infinite;
      }

      .dot {
        offset-path: path("M4 18 C 70 4, 140 32, 216 14 S 360 28, 396 16");
        offset-rotate: 0deg;
        animation: ride 2.8s var(--ease) infinite;
      }

      @keyframes drift-a {
        to { transform: translate3d(8%, 10%, 0) scale(1.08); }
      }

      @keyframes drift-b {
        to { transform: translate3d(-10%, -8%, 0) scale(1.12); }
      }

      @keyframes pulse {
        50% { transform: scale(1.18); opacity: 0.7; }
      }

      @keyframes rise {
        to { opacity: 1; transform: none; }
      }

      @keyframes letter {
        to { opacity: 1; transform: none; }
      }

      @keyframes draw {
        from { transform: scaleX(0); transform-origin: left; }
        to { transform: scaleX(1); transform-origin: left; }
      }

      @keyframes shimmer {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }

      @keyframes dash {
        to { stroke-dashoffset: -256; }
      }

      @keyframes ride {
        0% { offset-distance: 0%; }
        100% { offset-distance: 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation: none !important;
          transition: none !important;
        }
        h1 span, .eyebrow, .lead, .moved, .track { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>
    <div class="orb orb-c" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="glow" id="glow" aria-hidden="true"></div>

    <main>
      <p class="eyebrow"><i></i> This page has moved</p>
      <h1 aria-label="Sorry">
        <span style="animation-delay: 0.18s">S</span>
        <span style="animation-delay: 0.28s">o</span>
        <span style="animation-delay: 0.36s">r</span>
        <span style="animation-delay: 0.44s">r</span>
        <span style="animation-delay: 0.52s">y</span>
      </h1>
      <p class="lead">Whatever you are looking for is not here.</p>
      <p class="moved">It is moved to <span class="brand">ClearTrack</span></p>

      <svg class="track" viewBox="0 0 400 36" aria-hidden="true">
        <defs>
          <linearGradient id="flow" x1="0" x2="1">
            <stop offset="0" stop-color="#8ef5c8" />
            <stop offset="1" stop-color="#7cd4ff" />
          </linearGradient>
        </defs>
        <path d="M4 18 C 70 4, 140 32, 216 14 S 360 28, 396 16" />
        <path class="flow" d="M4 18 C 70 4, 140 32, 216 14 S 360 28, 396 16" />
        <circle class="dot" r="4.5" fill="#8ef5c8">
          <animate attributeName="opacity" values="0.55;1;0.55" dur="2.8s" repeatCount="indefinite" />
        </circle>
      </svg>
    </main>

    <script>
      const glow = document.getElementById("glow");
      window.addEventListener("pointermove", (event) => {
        glow.style.transform = `translate3d(${event.clientX}px, ${event.clientY}px, 0)`;
      }, { passive: true });
    </script>
  </body>
</html>
