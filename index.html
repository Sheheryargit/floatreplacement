<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="refresh" content="22;url=https://alloc8-dev.ctk.au.deloitte.com/" />
    <title>Alloc8 has moved — ClearTrack</title>
    <style>
      :root {
        --bg: #000;
        --text: #f5f5f7;
        --mute: rgba(245, 245, 247, 0.56);
        --blue: #2997ff;
        --green: #86bc25;
        --spring: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        perspective: 1400px;
      }

      body.is-leaving main,
      body.is-leaving .sheet {
        filter: blur(22px);
        opacity: 0;
        transition: filter 0.7s var(--spring), opacity 0.6s ease;
      }

      .wash {
        position: fixed;
        inset: -20%;
        background:
          radial-gradient(ellipse 50% 40% at 50% 0%, rgba(41, 151, 255, 0.18), transparent 62%),
          radial-gradient(ellipse 40% 36% at 70% 80%, rgba(134, 188, 37, 0.12), transparent 60%),
          radial-gradient(ellipse 36% 30% at 22% 78%, rgba(191, 90, 242, 0.08), transparent 58%);
        animation: wash 14s var(--spring) infinite alternate;
        pointer-events: none;
      }

      .veil {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 30%, #000 88%);
        pointer-events: none;
      }

      .dim {
        position: fixed;
        inset: 0;
        z-index: 6;
        background: rgba(0, 0, 0, 0.38);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        backdrop-filter: blur(18px) saturate(140%);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.55s var(--spring);
      }

      .dim.is-on { opacity: 1; }

      main {
        position: relative;
        z-index: 1;
        width: min(780px, calc(100vw - 48px));
        text-align: center;
        transition: filter 0.55s var(--spring), opacity 0.55s var(--spring), transform 0.55s var(--spring);
      }

      main.is-dim {
        filter: blur(10px);
        opacity: 0.28;
        transform: scale(0.98);
      }

      .kicker {
        margin-bottom: 28px;
        color: var(--mute);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        min-height: 1.2em;
        opacity: 0;
      }

      .kicker.is-in { animation: reveal 1.2s var(--spring) forwards; }

      .kicker .dots::after {
        content: "";
        animation: dots 1.2s steps(4, end) infinite;
      }

      h1 {
        font-size: clamp(4.4rem, 13vw, 7.6rem);
        font-weight: 600;
        letter-spacing: -0.055em;
        line-height: 0.92;
      }

      h1 span {
        display: inline-block;
        opacity: 0;
        filter: blur(18px);
        transform: translateY(28px) scale(0.92);
      }

      h1 span.is-in {
        opacity: 1;
        filter: blur(0);
        transform: none;
        animation: reveal 1.15s var(--spring) both;
      }

      h1.is-hold span.is-in {
        opacity: 1;
        filter: none;
        animation: settle 2.4s ease-in-out infinite;
      }

      h1 .eight { color: var(--green); }

      .moved {
        margin-top: 14px;
        color: var(--text);
        font-size: clamp(1.7rem, 4.2vw, 2.35rem);
        font-weight: 500;
        letter-spacing: -0.03em;
        min-height: 1.2em;
      }

      .moved span {
        display: inline-block;
        opacity: 0;
        filter: blur(14px);
        transform: translateY(16px);
      }

      .moved span.is-in {
        opacity: 1;
        filter: blur(0);
        transform: none;
        animation: reveal 1.1s var(--spring) both;
      }

      .glass {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 36px;
        padding: 12px 18px 12px 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        text-decoration: none;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          0 20px 50px rgba(0, 0, 0, 0.35);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        backdrop-filter: blur(24px) saturate(160%);
        opacity: 0;
        filter: blur(18px);
        transform: translateY(18px) scale(0.96);
      }

      .glass.is-in {
        animation: reveal 1.2s var(--spring) forwards, sheen 5s ease-in-out 1.2s infinite;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 0 rgba(41, 151, 255, 0.45);
        animation: ping 2.4s var(--spring) infinite;
      }

      .glass em {
        font-style: normal;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }

      .glass strong {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .burst {
        position: fixed;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }

      .ring {
        position: absolute;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;
        opacity: 0;
      }

      .ring.is-on { animation: ring-burst 1.35s var(--spring) forwards; }

      .shard {
        position: absolute;
        width: 7px;
        height: 7px;
        margin: -3px 0 0 -3px;
        background: #f5f5f7;
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
        opacity: 0;
      }

      .shard.is-on { animation: shard-fly 1.4s var(--spring) forwards; }

      .sheet {
        position: fixed;
        inset: 0;
        z-index: 7;
        display: grid;
        place-items: center;
        pointer-events: none;
        opacity: 0;
      }

      .sheet.is-on { opacity: 1; }

      .paper {
        width: min(420px, calc(100vw - 40px));
        transform-style: preserve-3d;
        transform-origin: 70% 10%;
      }

      .paper.is-in { animation: paper-in 0.7s var(--spring) both; }
      .paper.is-fold { animation: paper-fold 0.38s var(--spring) forwards; }
      .paper.is-fly { animation: paper-fly 1.05s cubic-bezier(0.4, 0.02, 0.2, 1) forwards; }

      .paper-face {
        padding: 22px 24px 26px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
        background: rgba(28, 28, 30, 0.72);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          0 28px 80px rgba(0, 0, 0, 0.45);
        -webkit-backdrop-filter: blur(32px) saturate(180%);
        backdrop-filter: blur(32px) saturate(180%);
        text-align: center;
      }

      .wave {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        height: 28px;
        margin-bottom: 16px;
      }

      .wave i {
        display: block;
        width: 2px;
        height: 8px;
        border-radius: 99px;
        background: linear-gradient(180deg, #64d2ff, #2997ff 55%, #bf5af2);
        animation: wave 1.15s ease-in-out infinite;
      }

      .sheet-kicker {
        color: var(--mute);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .sheet h2 {
        margin-top: 8px;
        font-size: 1.45rem;
        font-weight: 600;
        letter-spacing: -0.035em;
      }

      .sheet-lead {
        margin-top: 8px;
        color: var(--mute);
        font-size: 14px;
        font-weight: 500;
        line-height: 1.45;
      }

      @keyframes reveal {
        to { opacity: 1; filter: blur(0); transform: none; }
      }

      @keyframes settle {
        0%, 100% { opacity: 1; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-3px); }
      }

      @keyframes wash {
        to { transform: scale(1.08) translate3d(0, -2%, 0); }
      }

      @keyframes ping {
        0% { box-shadow: 0 0 0 0 rgba(41, 151, 255, 0.45); }
        70% { box-shadow: 0 0 0 10px rgba(41, 151, 255, 0); }
      }

      @keyframes sheen {
        0%, 100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 20px 50px rgba(0, 0, 0, 0.35); }
        50% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 24px 60px rgba(41, 151, 255, 0.12); }
      }

      @keyframes dots {
        0% { content: ""; }
        25% { content: "."; }
        50% { content: ".."; }
        75% { content: "..."; }
      }

      @keyframes ring-burst {
        from { transform: scale(0.4); opacity: 0.8; }
        to { transform: scale(18); opacity: 0; }
      }

      @keyframes shard-fly {
        from { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
        to {
          opacity: 0;
          transform: translate(var(--x), var(--y)) scale(0.2) rotate(140deg);
        }
      }

      @keyframes wave {
        0%, 100% { transform: scaleY(0.45); opacity: 0.55; }
        50% { transform: scaleY(1.8); opacity: 1; }
      }

      @keyframes paper-in {
        from { opacity: 0; filter: blur(16px); transform: scale(0.9) translateY(22px) rotateX(8deg); }
        to { opacity: 1; filter: blur(0); transform: none; }
      }

      @keyframes paper-fold {
        to { transform: rotateY(-28deg) rotateX(10deg) scaleX(0.86) skewY(-4deg); }
      }

      @keyframes paper-fly {
        0% { opacity: 1; transform: rotateY(-28deg) rotateX(10deg) scaleX(0.86); }
        28% { transform: rotateX(-12deg) rotateY(16deg) rotateZ(-8deg) translate3d(-8px, -18px, 40px); }
        100% {
          opacity: 0;
          transform: rotateX(58deg) rotateY(-18deg) rotateZ(32deg) translate3d(46vw, -72vh, 220px) scale(0.22);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
        h1 span, .moved span, .kicker, .glass, .sheet, .paper { opacity: 1; filter: none; transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="wash" aria-hidden="true"></div>
    <div class="veil" aria-hidden="true"></div>
    <div class="dim" id="dim" aria-hidden="true"></div>
    <div class="burst" id="burst" aria-hidden="true"></div>

    <main id="stage">
      <p class="kicker" id="kicker">Alloc8 has a new home</p>
      <h1 aria-label="Alloc8" id="title">
        <span>A</span><span>l</span><span>l</span><span>o</span><span>c</span><span class="eight">8</span>
      </h1>
      <p class="moved" aria-label="has moved">
        <span id="w1">has</span>
        <span id="w2">moved</span>
      </p>
      <a class="glass" id="glass" href="https://alloc8-dev.ctk.au.deloitte.com/">
        <span class="dot"></span>
        <em>Continue on</em>
        <strong>ClearTrack</strong>
      </a>
    </main>

    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="vpn-title">
      <div class="paper" id="paper">
        <div class="paper-face">
          <div class="wave" id="wave" aria-hidden="true"></div>
          <p class="sheet-kicker">Before you continue</p>
          <h2 id="vpn-title">Do you have your VPN on?</h2>
          <p class="sheet-lead">The next site is on the Deloitte network and needs VPN.</p>
        </div>
      </div>
    </div>

    <script>
      const DEST = "https://alloc8-dev.ctk.au.deloitte.com/";
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const dim = document.getElementById("dim");
      const burst = document.getElementById("burst");
      const stage = document.getElementById("stage");
      const kicker = document.getElementById("kicker");
      const title = document.getElementById("title");
      const glass = document.getElementById("glass");
      const sheet = document.getElementById("sheet");
      const paper = document.getElementById("paper");
      const wave = document.getElementById("wave");
      const letters = [...document.querySelectorAll("#title span")];
      const words = [document.getElementById("w1"), document.getElementById("w2")];

      for (let i = 0; i < 22; i += 1) {
        const bar = document.createElement("i");
        bar.style.animationDelay = `${i * 0.045}s`;
        bar.style.height = `${7 + ((i * 17) % 14)}px`;
        wave.appendChild(bar);
      }

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      let leaving = false;

      function show(el) {
        el.classList.add("is-in");
      }

      function burstFrom(el) {
        const box = el.getBoundingClientRect();
        const x = box.left + box.width / 2;
        const y = box.top + box.height / 2;
        const colors = ["#f5f5f7", "#2997ff", "#86bc25", "#64d2ff"];

        for (let i = 0; i < 2; i += 1) {
          const ring = document.createElement("i");
          ring.className = "ring";
          ring.style.left = `${x}px`;
          ring.style.top = `${y}px`;
          ring.style.animationDelay = `${i * 90}ms`;
          burst.appendChild(ring);
          requestAnimationFrame(() => ring.classList.add("is-on"));
        }

        for (let i = 0; i < 28; i += 1) {
          const shard = document.createElement("i");
          const angle = (Math.PI * 2 * i) / 28;
          const dist = 90 + (i % 5) * 28;
          shard.className = "shard";
          shard.style.left = `${x}px`;
          shard.style.top = `${y}px`;
          shard.style.background = colors[i % colors.length];
          shard.style.setProperty("--x", `${Math.cos(angle) * dist}px`);
          shard.style.setProperty("--y", `${Math.sin(angle) * dist}px`);
          shard.style.animationDelay = `${(i % 6) * 18}ms`;
          burst.appendChild(shard);
          requestAnimationFrame(() => shard.classList.add("is-on"));
        }

        setTimeout(() => { burst.innerHTML = ""; }, 1600);
      }

      async function askVpn() {
        kicker.innerHTML = 'One check before ClearTrack<span class="dots"></span>';
        stage.classList.add("is-dim");
        dim.classList.add("is-on");
        sheet.classList.add("is-on");
        paper.classList.add("is-in");
        await wait(2800);
      }

      async function origamiOut() {
        paper.classList.remove("is-in");
        paper.classList.add("is-fold");
        await wait(320);
        paper.classList.add("is-fly");
        dim.classList.remove("is-on");
        await wait(980);
      }

      async function go() {
        if (leaving) return;
        leaving = true;
        if (!reduce) {
          await askVpn();
          await origamiOut();
        }
        kicker.textContent = "Opening ClearTrack";
        document.body.classList.add("is-leaving");
        setTimeout(() => window.location.replace(DEST), 520);
      }

      async function run() {
        if (reduce) {
          [...letters, ...words, kicker, glass].forEach(show);
          await go();
          return;
        }

        show(kicker);
        await wait(900);
        for (const letter of letters) {
          show(letter);
          await wait(280);
        }
        title.classList.add("is-hold");
        await wait(700);
        for (const word of words) {
          show(word);
          await wait(520);
        }
        await wait(800);
        burstFrom(title);
        await wait(1100);
        show(glass);
        await wait(1400);
        await go();
      }

      run();

      glass.addEventListener("click", (event) => {
        event.preventDefault();
        go();
      });
    </script>
  </body>
</html>
