<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="refresh" content="12;url=https://alloc8-dev.ctk.au.deloitte.com/" />
    <title>Alloc8 has moved — ClearTrack</title>
    <style>
      :root {
        --bg: #000;
        --text: #f5f5f7;
        --mute: rgba(245, 245, 247, 0.56);
        --blue: #2997ff;
        --green: #86bc25;
        --spring: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }

      body.is-leaving main {
        filter: blur(22px) saturate(140%);
        transform: scale(1.08);
        opacity: 0;
        transition: filter 0.9s var(--spring), transform 0.9s var(--spring), opacity 0.8s ease;
      }

      .wash {
        position: fixed;
        inset: -20%;
        background:
          radial-gradient(ellipse 50% 40% at 50% 0%, rgba(41, 151, 255, 0.18), transparent 62%),
          radial-gradient(ellipse 40% 36% at 70% 80%, rgba(134, 188, 37, 0.12), transparent 60%),
          radial-gradient(ellipse 36% 30% at 22% 78%, rgba(191, 90, 242, 0.08), transparent 58%);
        animation: wash 14s var(--spring) infinite alternate;
        pointer-events: none;
      }

      .veil {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 30%, #000 88%);
        pointer-events: none;
      }

      .glow {
        position: fixed;
        width: 40rem;
        height: 40rem;
        margin: -20rem 0 0 -20rem;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(41, 151, 255, 0.16), rgba(191, 90, 242, 0.06) 42%, transparent 68%);
        pointer-events: none;
        transform: translate3d(-50vw, -50vh, 0);
        transition: transform 0.85s var(--spring);
      }

      body.is-leaving .glow {
        width: 80rem;
        height: 80rem;
        margin: -40rem 0 0 -40rem;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.22), rgba(41, 151, 255, 0.2), transparent 70%);
      }

      main {
        position: relative;
        z-index: 1;
        width: min(780px, calc(100vw - 48px));
        text-align: center;
      }

      .kicker {
        margin-bottom: 28px;
        color: var(--mute);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        min-height: 1.2em;
        opacity: 0;
        filter: blur(16px);
        transform: translateY(12px);
        animation: reveal 1.15s var(--spring) 0.1s forwards;
      }

      .kicker .dots::after {
        content: "";
        animation: dots 1.2s steps(4, end) infinite;
      }

      h1 {
        font-size: clamp(4.4rem, 13vw, 7.6rem);
        font-weight: 600;
        letter-spacing: -0.055em;
        line-height: 0.92;
      }

      h1 span {
        display: inline-block;
        opacity: 0;
        filter: blur(18px);
        transform: translateY(22px);
        animation: reveal 1.2s var(--spring) forwards;
      }

      h1 span.is-focus {
        color: #fff;
        text-shadow: 0 0 32px rgba(41, 151, 255, 0.45);
        transform: translateY(-3px);
      }

      h1 .eight {
        color: var(--green);
        animation:
          reveal 1.2s var(--spring) forwards,
          breathe 4.4s ease-in-out 1.6s infinite;
      }

      .moved {
        margin-top: 14px;
        color: var(--text);
        font-size: clamp(1.7rem, 4.2vw, 2.35rem);
        font-weight: 400;
        letter-spacing: -0.03em;
        min-height: 1.2em;
      }

      .moved .typed { font-weight: 500; }

      .caret {
        display: inline-block;
        width: 2px;
        height: 0.82em;
        margin-left: 3px;
        background: var(--blue);
        vertical-align: -0.08em;
        opacity: 0;
        animation: caret 0.9s steps(1) infinite;
      }

      .caret.on { opacity: 1; }

      .path {
        display: block;
        width: min(220px, 50vw);
        height: 36px;
        margin: 18px auto 0;
        overflow: visible;
        opacity: 0;
      }

      .path.is-on { opacity: 1; transition: opacity 0.4s ease; }

      .path .rail {
        fill: none;
        stroke: rgba(255, 255, 255, 0.12);
        stroke-width: 1.25;
      }

      .path .ink {
        fill: none;
        stroke: url(#agent-flow);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-dasharray: 240;
        stroke-dashoffset: 240;
      }

      .path.is-draw .ink {
        animation: draw-path 1.15s var(--spring) forwards;
      }

      .glass {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        padding: 12px 18px 12px 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        text-decoration: none;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          0 20px 50px rgba(0, 0, 0, 0.35);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        backdrop-filter: blur(24px) saturate(160%);
        opacity: 0;
        filter: blur(18px);
        transform: translateY(18px) scale(0.96);
        animation: reveal 1.2s var(--spring) 1.15s forwards, sheen 5s ease-in-out 2.4s infinite;
      }

      .glass.is-press { animation: press 0.42s var(--spring); }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 0 rgba(41, 151, 255, 0.45);
        animation: ping 2.4s var(--spring) 1.8s infinite;
      }

      .glass em {
        font-style: normal;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }

      .glass strong {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .agent {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 5;
        width: 20px;
        height: 20px;
        margin: -10px 0 0 -10px;
        pointer-events: none;
        opacity: 0;
        transform: translate3d(-40px, -40px, 0);
      }

      .agent.is-on { opacity: 1; }

      .agent-core {
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: conic-gradient(from 180deg, #2997ff, #64d2ff, #86bc25, #bf5af2, #2997ff);
        animation: spin 2.6s linear infinite;
      }

      .agent-ring {
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.3);
        animation: agent-halo 1.8s var(--spring) infinite;
      }

      .agent.is-click .agent-core { transform: scale(0.7); }
      .agent.is-click .agent-ring { animation: click-ring 0.5s var(--spring); }

      .crumb {
        position: fixed;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: #64d2ff;
        pointer-events: none;
        z-index: 4;
        opacity: 0.7;
        animation: crumb 0.9s ease-out forwards;
      }

      @keyframes reveal {
        to { opacity: 1; filter: blur(0); transform: none; }
      }

      @keyframes wash {
        to { transform: scale(1.08) translate3d(0, -2%, 0); }
      }

      @keyframes breathe {
        50% { transform: translateY(-2px); }
      }

      @keyframes ping {
        0% { box-shadow: 0 0 0 0 rgba(41, 151, 255, 0.45); }
        70% { box-shadow: 0 0 0 10px rgba(41, 151, 255, 0); }
      }

      @keyframes sheen {
        0%, 100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 20px 50px rgba(0, 0, 0, 0.35); }
        50% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 24px 60px rgba(41, 151, 255, 0.12); }
      }

      @keyframes press {
        0% { transform: scale(1); }
        40% { transform: scale(0.95); }
        100% { transform: scale(1); }
      }

      @keyframes caret { 50% { opacity: 0; } }

      @keyframes dots {
        0% { content: ""; }
        25% { content: "."; }
        50% { content: ".."; }
        75% { content: "..."; }
      }

      @keyframes draw-path { to { stroke-dashoffset: 0; } }
      @keyframes spin { to { transform: rotate(1turn); } }
      @keyframes agent-halo { 50% { transform: scale(1.2); opacity: 0.4; } }
      @keyframes click-ring {
        from { transform: scale(0.8); opacity: 1; }
        to { transform: scale(2.2); opacity: 0; }
      }
      @keyframes crumb {
        to { opacity: 0; transform: scale(0.2); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
        h1 span, .kicker, .glass, .path { opacity: 1; filter: none; transform: none; }
        .agent { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="wash" aria-hidden="true"></div>
    <div class="veil" aria-hidden="true"></div>
    <div class="glow" id="glow" aria-hidden="true"></div>
    <div class="agent" id="agent" aria-hidden="true">
      <span class="agent-core"></span>
      <span class="agent-ring"></span>
    </div>

    <main>
      <p class="kicker" id="kicker">Agent relocating Alloc8<span class="dots"></span></p>
      <h1 aria-label="Alloc8" id="title">
        <span style="animation-delay: 0.18s">A</span>
        <span style="animation-delay: 0.26s">l</span>
        <span style="animation-delay: 0.34s">l</span>
        <span style="animation-delay: 0.42s">o</span>
        <span style="animation-delay: 0.50s">c</span>
        <span class="eight" style="animation-delay: 0.60s">8</span>
      </h1>
      <p class="moved" aria-label="has moved">
        <span class="typed" id="typed"></span><span class="caret" id="caret"></span>
      </p>
      <svg class="path" id="path" viewBox="0 0 220 36" aria-hidden="true">
        <defs>
          <linearGradient id="agent-flow" x1="0" x2="1">
            <stop offset="0" stop-color="#2997ff" />
            <stop offset="1" stop-color="#86bc25" />
          </linearGradient>
        </defs>
        <path class="rail" d="M8 18 C 60 6, 110 30, 160 14 S 212 22, 212 22" />
        <path class="ink" d="M8 18 C 60 6, 110 30, 160 14 S 212 22, 212 22" />
      </svg>
      <a class="glass" id="glass" href="https://alloc8-dev.ctk.au.deloitte.com/">
        <span class="dot"></span>
        <em>Continue on</em>
        <strong>ClearTrack</strong>
      </a>
    </main>

    <script>
      const DEST = "https://alloc8-dev.ctk.au.deloitte.com/";
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const agent = document.getElementById("agent");
      const glow = document.getElementById("glow");
      const kicker = document.getElementById("kicker");
      const typed = document.getElementById("typed");
      const caret = document.getElementById("caret");
      const path = document.getElementById("path");
      const glass = document.getElementById("glass");
      const letters = [...document.querySelectorAll("#title span")];

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      function pointOf(el, ox = 0.5, oy = 0.55) {
        const box = el.getBoundingClientRect();
        return { x: box.left + box.width * ox, y: box.top + box.height * oy };
      }

      function dropCrumb(x, y) {
        const crumb = document.createElement("i");
        crumb.className = "crumb";
        crumb.style.left = `${x}px`;
        crumb.style.top = `${y}px`;
        document.body.appendChild(crumb);
        setTimeout(() => crumb.remove(), 900);
      }

      function moveTo(el, duration = 780, ox, oy) {
        const { x, y } = pointOf(el, ox, oy);
        agent.style.transition = `transform ${duration}ms cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease`;
        agent.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        glow.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        const steps = Math.max(3, Math.round(duration / 140));
        for (let i = 1; i < steps; i += 1) {
          setTimeout(() => {
            const now = agent.getBoundingClientRect();
            dropCrumb(now.left + now.width / 2, now.top + now.height / 2);
          }, (duration / steps) * i);
        }
        return wait(duration);
      }

      async function typeLine(text) {
        typed.textContent = "";
        caret.classList.add("on");
        for (const char of text) {
          typed.textContent += char;
          await wait(char === " " ? 80 : 52);
        }
      }

      async function clickGlass() {
        agent.classList.add("is-click");
        glass.classList.add("is-press");
        await wait(380);
      }

      function go() {
        document.body.classList.add("is-leaving");
        kicker.textContent = "Opening ClearTrack";
        setTimeout(() => {
          window.location.replace(DEST);
        }, 720);
      }

      async function run() {
        if (reduce) {
          typed.textContent = "has moved";
          kicker.textContent = "Opening ClearTrack";
          await wait(700);
          go();
          return;
        }

        await wait(500);
        agent.classList.add("is-on");
        await moveTo(letters[0], 820, 0.5, 0.4);

        for (const letter of letters) {
          letters.forEach((node) => node.classList.remove("is-focus"));
          letter.classList.add("is-focus");
          await moveTo(letter, 320, 0.5, 0.38);
          await wait(40);
        }

        kicker.innerHTML = 'Writing the handoff<span class="dots"></span>';
        await moveTo(typed, 700, 0.12, 0.6);
        await typeLine("has moved");
        await wait(220);
        caret.classList.remove("on");

        path.classList.add("is-on", "is-draw");
        kicker.innerHTML = 'Routing to ClearTrack<span class="dots"></span>';
        await moveTo(glass, 1100, 0.82, 0.5);
        await clickGlass();
        go();
      }

      run();

      glass.addEventListener("click", (event) => {
        event.preventDefault();
        go();
      });
    </script>
  </body>
</html>
